# Пресет для HYPEUSDT — young listing с сильным восходящим трендом.
# Краткое обоснование per-параметра — см. comments ниже.
# Использование:
#   python scripts/calc_volatility.py HYPEUSDT --config config/settings_hype.yaml
#   python scripts/add_trade.py HYPEUSDT long 2026-01-20 --config config/settings_hype.yaml \
#       --use-config-defaults ...

exchange: bybit
market_type: linear
timeframe: 1h
history_days: 90            # HYPE листится на Bybit Linear ~ с конца 2024; пока <2160 свечей
horizons_hours: [24, 72, 168]
safety_factor: 1.2
leverage: 1                 # ⚠️ обязательно 1x isolated.
                             # Backtest 18м: при 2x → 25 ликвидаций (0.78% сделок).
                             # При 1x → 0 ликвидаций, min_pnl -16..-20%.
maintenance_margin_rate: 0.005

dca:
  orders_range: [3, 7]       # шире диапазон — позволяет рекомендатору искать минимум
  price_scale_range: [1.1, 1.5]
  base_qty_pct_long: 0.04
  base_qty_pct_short: 0.03
  volume_scale_thresholds:
    conservative: 2.0
    moderate: 1.5

current_settings:
  long:
    # Узкая DCA-сетка для частого заполнения ордеров.
    # Backtest 180д HYPE, maker fee 0.04%/cycle:
    #   ps 1.04 + vs 1.20 + TP 1.0%: win 99.0%, total +900.0%, Sharpe 179, hold 13h.
    #   Все 5 ордеров заполняются (L4=3.2% fill rate), avg_entries=1.34.
    #   Coverage 14.5% (до $61.82 от $72.31) — частые мелкие откаты.
    #   vs 1.10 → PnL +818%; vs 1.20 → PnL +900% (+10% профита от мартингейла).
    orders: 5
    price_coverage: 0.145    # 14.5% — частые мелкие откаты 3-4%
    price_scale: 1.04         # шаг 3.8%: 72.31 → 69.53 → 66.86 → 64.29 → 61.82
    volume_scale: 1.20       # мартингейл 20%: 0.30 / 0.36 / 0.43 / 0.52 / 0.62
    base_qty: 0.30           # ~$21.69 1-й ордер; total ~2.23 HYPE ($147) при полном заполнении

  short:
    # Узкая шорт-сетка для частого заполнения.
    # Backtest 180д HYPE, maker fee 0.04%/cycle:
    #   ps 1.03 + vs 1.20 + TP 1.0%: win 98.4%, total +698.4%, Sharpe 30, hold 12h.
    #   Все 5 ордеров заполняются (L4=2.3% fill rate), avg_entries=1.44.
    #   Coverage 12.6% (до $81.39 от $72.31) — частые мелкие пампы 3%.
    orders: 5
    price_coverage: 0.126    # 12.6% — частые мелкие пампы 3%
    price_scale: 1.03         # шаг 3.0%: 72.31 → 74.48 → 76.72 → 79.02 → 81.39
    volume_scale: 1.20       # мартингейл 20%: 0.015 / 0.018 / 0.022 / 0.026 / 0.031
    base_qty: 0.015          # ~$1.08 1-й ордер; total ~0.11 HYPE ($8.66) при полном заполнении

  tp: 0.010                  # 1.0% — лимитный TP (maker 0.02% × 2 = 0.04% за цикл).
                             # Backtest 180д: LONG win 99.0%, +900% PnL; SHORT win 98.4%, +698% PnL.
                             # Узкая сетка (ps 1.03-1.04) заполняет все ордера →
                             # DCA реально усредняет, hold 12-13ч, Sharpe 30-179.
                             # Альтернативы:
                             #   TP 0.8%  → быстрый выход, но меньше профита
                             #   TP 1.2%  → длиннее hold, win rate ~97%

recommendation_horizon: 168

cache:
  enabled: true
  dir: data/cache

trades_journal:
  csv_path: data/trades/journal.csv
  json_path: data/trades/journal.json