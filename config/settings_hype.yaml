# Пресет для HYPEUSDT — young listing с сильным восходящим трендом.
# Краткое обоснование per-параметра — см. comments ниже.
# Использование:
#   python scripts/calc_volatility.py HYPEUSDT --config config/settings_hype.yaml
#   python scripts/add_trade.py HYPEUSDT long 2026-01-20 --config config/settings_hype.yaml \
#       --use-config-defaults ...

exchange: bybit
market_type: linear
timeframe: 1h
history_days: 90            # HYPE листится на Bybit Linear ~ с конца 2024; пока <2160 свечей
horizons_hours: [24, 72, 168]
safety_factor: 1.2
leverage: 1                 # ⚠️ обязательно 1x isolated.
                             # Backtest 18м: при 2x → 25 ликвидаций (0.78% сделок).
                             # При 1x → 0 ликвидаций, min_pnl -16..-20%.
maintenance_margin_rate: 0.005

dca:
  orders_range: [3, 7]       # шире диапазон — позволяет рекомендатору искать минимум
  price_scale_range: [1.1, 1.5]
  base_qty_pct_long: 0.04
  base_qty_pct_short: 0.03
  volume_scale_thresholds:
    conservative: 2.0
    moderate: 1.5

current_settings:
  long:
    # Расширенная DCA-сетка для защиты от глубоких падений.
    # Backtest 18м (540д) HYPE, maker fee 0.04%/cycle:
    #   10 ордеров + ps 1.10 + vs 1.06 + TP 1.2%: win 100%, total +400.7%, hold 17h.
    #   При падении до $32: средняя $49.06, до BE +53% (vs +103% у старой сетки).
    #   Coverage 57.6% (до $30.67) vs 18.8% (до $58.69) — в 3 раза шире.
    orders: 10
    price_coverage: 0.576    # 57.6% — покрывает падение до $30.67 от $72.31
    price_scale: 1.10        # 10 уровней: 72.31 → 65.74 → 59.76 → ... → 30.67
    volume_scale: 1.06       # мягкий мартингейл 6%: 0.30 / 0.318 / 0.337 / ...
    base_qty: 0.30           # ~$21.70 1-й ордер при $72; total ~4 HYPE при полном заполнении

  short:
    # Расширенная шорт-сетка для защиты от сильных пампов.
    # Backtest 18м (540д) HYPE, maker fee 0.04%/cycle:
    #   10 ордеров + ps 1.10 + vs 1.06 + TP 1.2%: win 96.1%, total +387.97%, sharpe 32.41.
    #   При пампе до $120: средняя $94.49, до BE +21.3% (vs +32% у старой сетки).
    #   Coverage 135.8% (до $170.51) vs 23.2% (до $89.10) — в 6 раз шире.
    orders: 10
    price_coverage: 1.358    # 135.8% — покрывает памп до $170.51 от $72.31
    price_scale: 1.10        # 10 уровней: 72.31 → 79.55 → 87.50 → ... → 170.51
    volume_scale: 1.06       # мягкий мартингейл 6%: 0.015 / 0.0159 / 0.0169 / ...
    base_qty: 0.015          # ~$1.08 1-й ордер при $72; total ~0.2 HYPE при полном заполнении

  tp: 0.012                  # 1.2% — лимитный TP (maker 0.02% × 2 = 0.04% за цикл).
                             # Backtest 18м: win 100%, avg PnL +1.113%, hold 17h.
                             # Альтернативы:
                             #   TP 0.8%   → $19/мес long, win 96.7%  (консервативнее)
                             #   TP 2.0%   → $23/мес long, win 92.6%  (дольше hold 35h)
                             # ⚠️ Трейлинг-TP 0.5% в текущей низкой волатильности
                             # (1.05%/час vs истор. 1.86%) срабатывает на шуме, дал -3%/мес.
                             # Включайте trailing только при возврате волы к 1.8%+.

recommendation_horizon: 168

cache:
  enabled: true
  dir: data/cache

trades_journal:
  csv_path: data/trades/journal.csv
  json_path: data/trades/journal.json