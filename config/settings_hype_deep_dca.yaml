# ═══════════════════════════════════════════════════════════════
# HYPE DEEP DCA — стратегия под глубокую просадку $68 → $40
# ═══════════════════════════════════════════════════════════════
# Сценарий:
#   - Entry $68, ожидаемое дно $40 (-41%), откат +30% → $52
#   - Цель: TP 0.8% должен сработать при откате с дна
#   - → avg entry ≤ $51.59 (т.е. $52 / 1.008)
#
# Решение: 7 ордеров, ps=1.10 (шаг 10%), vs=1.20 (мартингейл):
#   - Coverage 41% (от $68 до $38.38)
#   - Avg = $48.57, TP @ $48.96
#   - Capital $119 (60% от $200) — запас 40% для доп.усреднения/финансирования
#   - При любом дне в интервале $38-$46 и откате +30% → TP hit
#
# Backtest 90д (стандартный режим, не crash):
#   win 100%, PnL +92%, hold 11.1ч, DD 0%, 0 ликвидаций
#   Медленнее чем ps=1.012 (3.3ч), но безопаснее при глубокой просадке
#
# ВНИМАНИЕ: в обычном режиме hold 11ч, чаще заполняется только 1-2 ордера.
# Глубокие ордера (4-6) заполнятся ТОЛЬКО при реальном падении -30..-41%.
# ═══════════════════════════════════════════════════════════════

exchange: bybit
market_type: linear
timeframe: 1h
history_days: 90
horizons_hours: [24, 72, 168]
safety_factor: 1.2
leverage: 1
maintenance_margin_rate: 0.005
fee_pct: 0.0004

dca:
  orders_range: [7, 7]
  price_scale_range: [1.05, 1.15]
  volume_scale_thresholds:
    conservative: 1.20
    moderate: 1.15

current_settings:
  long:
    # Coverage: 41% (широкая сетка под deep drawdown)
    # Шаг цены: 10% между ордерами (68.00 → 61.82 → 56.20 → 51.09 → 46.44 → 42.22 → 38.38)
    # vs=1.20 → умеренный мартингейл: 0.19 / 0.228 / 0.274 / 0.328 / 0.394 / 0.473 / 0.567
    # Total notional ~$119 (60% от $200), запас 40% на funding/fee
    # Avg при полном заполнении: $48.57 → TP @ $48.96
    # При падении $68→$40 и откате +30% (=$52) → TP сработает
    orders: 7
    price_coverage: 0.410
    price_scale: 1.10          # шаг 10%
    volume_scale: 1.20
    base_qty: 0.19            # $12.92 1-й ордер
    horizon_h: 720           # 30 дней на восстановление (даём время глубокому выходу)

  short:
    # Hedge против пампов — оставляем лёгкий (base=0.012)
    # При deep crash шорт не помогает (он в убытке при росте), но при откате вверх
    # закрывается в TP, освобождая capital
    orders: 5
    price_coverage: 0.126
    price_scale: 1.03
    volume_scale: 1.20
    base_qty: 0.012           # ~$0.82 1-й ордер
    horizon_h: 168

  tp: 0.008                   # 0.8% TP — быстрый выход на откате

recommendation_horizon: 168

cache:
  enabled: true
  dir: data/cache
trades_journal:
  csv_path: data/trades/journal.csv
  json_path: data/trades/journal.json