# ═══════════════════════════════════════════════════════════════
# ВАРИАНТ 1: horizon 168ч — БЫСТРЫЙ (max profit)
# ═══════════════════════════════════════════════════════════════
# Узкая сетка (шаг 3-4%), DCA ордера заполняются часто,
# быстрый TP за 12-13ч. Подходит для активной торговли.
#
# Backtest 180д:
#   LONG:  win 99.0%, PnL +900%, DD -0.66%, Sharpe 179, hold 13ч
#   SHORT: win 98.4%, PnL +698%, DD -2.48%, Sharpe 30, hold 12ч
# ═══════════════════════════════════════════════════════════════

exchange: bybit
market_type: linear
timeframe: 1h
history_days: 90
horizons_hours: [24, 72, 168]
safety_factor: 1.2
leverage: 1
maintenance_margin_rate: 0.005
fee_pct: 0.0004             # maker 0.02% × 2 стороны = 0.04% за цикл

dca:
  orders_range: [5, 5]
  price_scale_range: [1.03, 1.10]
  volume_scale_thresholds:
    conservative: 1.20
    moderate: 1.15

current_settings:
  long:
    # Coverage: 14.5% (до $61.82 от $72.31)
    # Шаг: 3.8% между ордерами
    # Заполняемость: L0=79% L1=12% L2=4% L3=3% L4=1%
    orders: 5
    price_coverage: 0.145
    price_scale: 1.04         # 72.31 → 69.53 → 66.86 → 64.29 → 61.82
    volume_scale: 1.20        # 0.30 / 0.36 / 0.43 / 0.52 / 0.62
    base_qty: 0.30           # $21.69 1-й ордер; total $147 при полном заполнении
    horizon_h: 168           # 7 дней на закрытие сделки

  short:
    # Coverage: 12.6% (до $81.39 от $72.31)
    # Шаг: 3.0% между ордерами
    # Заполняемость: L0=74% L1=17% L2=4% L3=2% L4=3%
    orders: 5
    price_coverage: 0.126
    price_scale: 1.03         # 72.31 → 74.48 → 76.72 → 79.02 → 81.39
    volume_scale: 1.20        # 0.015 / 0.018 / 0.022 / 0.026 / 0.031
    base_qty: 0.015           # $1.08 1-й ордер; total $8.66 при полном заполнении
    horizon_h: 168

  tp: 0.010                   # 1.0% TP (maker 0.04% за цикл → net ~0.96%)

recommendation_horizon: 168

cache:
  enabled: true
  dir: data/cache

trades_journal:
  csv_path: data/trades/journal.csv
  json_path: data/trades/journal.json