# ═══════════════════════════════════════════════════════════════
# Калибровка: больше ордеров → меньше шаг цены → быстрые TP
# ═══════════════════════════════════════════════════════════════
# Coverage тот же (14.6%), но 8 ордеров вместо 5
#   ps=1.0177 → шаг цены 2.28% (вместо 4%)
#   vs=1.10 → мягкий мартингейл, total ~2.17 HYPE, ~70% от $200
#   TP 1.0% → откат на <1% дает выход, hold < 5ч
# ═══════════════════════════════════════════════════════════════

exchange: bybit
market_type: linear
timeframe: 1h
history_days: 90
horizons_hours: [24, 72, 168]
safety_factor: 1.2
leverage: 1
maintenance_margin_rate: 0.005
fee_pct: 0.0004

dca:
  orders_range: [5, 10]
  price_scale_range: [1.03, 1.10]
  volume_scale_thresholds:
    conservative: 1.20
    moderate: 1.15

current_settings:
  long:
    # Coverage: 14.6% (тот же что у текущего бота)
    # Шаг цены: 2.28% (вместо 4% — частые мелкие ордера)
    # 8 ордеров → avg hold ~3-5ч
    orders: 10
    price_coverage: 0.146
    price_scale: 1.0177       # 68.73 → 67.20 → 65.70 → 64.24 → 62.81 → 61.41 → 60.04 → 58.70
    volume_scale: 1.10        # 0.19 / 0.21 / 0.23 / 0.25 / 0.28 / 0.31 / 0.34 / 0.37
    base_qty: 0.19           # $13.06 1-й ордер; total ~$141 при полном заполнении
    horizon_h: 168

  short:
    orders: 10
    price_coverage: 0.126
    price_scale: 1.0172
    volume_scale: 1.10
    base_qty: 0.010
    horizon_h: 168

  tp: 0.010

recommendation_horizon: 168

cache:
  enabled: true
  dir: data/cache
trades_journal:
  csv_path: data/trades/journal.csv
  json_path: data/trades/journal.json