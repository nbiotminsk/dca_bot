# ==============================================================================
# КОНФИГУРАЦИЯ ТОРГОВОЙ СТРАТЕГИИ BYBIT (FIBONACCI DUAL GRID & TRAILING)
# ==============================================================================
# Этот файл содержит основные параметры торговли. Вы можете менять значения прямо здесь.

# ------------------------------------------------------------------------------
# 1. РИСК-МЕНЕДЖМЕНТ (СТОП-ЛОСС)
# ------------------------------------------------------------------------------
risk:
  # Риск для локальной сетки Minor (до 24 свечей):
  # minor_risk_usd: $2.00 на суммарную позицию трех ордеров (0.500, 0.618 и 0.786).
  minor_risk_usd: 2.0

  # Независимый риск для Большой сетки Фибоначчи (до 96 свечей при пробое 0.382):
  # $2.00 на позицию трех ордеров Большой сетки.
  major_risk_usd: 2.0

  # Пропорция распределения объема входа тройной сетки (0.500 / 0.618 / 0.786):
  # 50% на Ордер 1 (0.500), 30% на Ордер 2 (0.618), 20% на Ордер 3 (0.786).
  # Суммарный риск при срабатывании стопа (SL 1.000) равен заданному minor_risk_usd / major_risk_usd ($2.00).
  grid_weights: [0.50, 0.30, 0.20]

  # Самостоятельный риск в долларах ($) на каждый ордер сетки манипуляции (1.414 и 1.618).
  # На ордер 1.414 выделяется указанная сумма риска (по умолчанию $2.0), и на ордер 1.618 также $2.0.
  # Суммарный риск корзины манипуляции при выбивании SL 2.414 составит 2 x manipulation_risk_usd ($4.0).
  manipulation_risk_usd: 2.0

# ------------------------------------------------------------------------------
# 2. ОТСТУПЫ (БУФЕРЫ) ВХОДА И ТЕЙК-ПРОФИТА В ПРОЦЕНТАХ (%)
# ------------------------------------------------------------------------------
buffers:
  # Индивидуальные буферы входа для тройной сетки (Long):
  # Сдвигают цену лимитного ордера на покупку ЧУТЬ ВЫШЕ точного уровня Фибоначчи,
  # чтобы ордер гарантированно налился перед крупными заявками на уровне.
  # Для уровня 0.500 Fib: +0.10%
  entry_buffer_0500_pct: 0.10
  # Для уровня 0.618 Fib: +0.15%
  entry_buffer_0618_pct: 0.15
  # Для уровня 0.786 Fib: +0.15%
  entry_buffer_0786_pct: 0.15

  # Индивидуальные буферы входа для сетки манипуляции (1.414 и 1.618):
  # Для уровня 1.414 Fib: +0.10%
  entry_buffer_1414_pct: 0.10
  # Для уровня 1.618 Fib: +0.10%
  entry_buffer_1618_pct: 0.10

  # Общий буфер входа по умолчанию:
  entry_buffer_pct: 0.10

  # Буфер фиксации прибыли (Take-Profit Long):
  # Сдвигает цену лимитного ордера на продажу ЧУТЬ НИЖЕ точного уровня Фибоначчи (-0.10%),
  # чтобы позиция закрылась заранее перед сопротивлением, не дожидаясь разворота.
  # Пример: уровень 0.236 = $991.82 -> тейк-профит выставляется по $990.83
  tp_buffer_pct: 0.10

  # --- Ложный пробой (Sweep Reclaim + MACD) ---
  # Максимальный выход за уровень 1.000 в % (по умолчанию 0.5%):
  # Выход не более 0.5% без закрепления цены считается ложным пробоем.
  # При выходе глубже 0.5% сетап переходит в сетку манипуляции (1.618 / 2.000).
  reclaim_max_sweep_pct: 0.5

  # Запрет закрепления (закрытия свечи) под уровнем 1.000:
  # false = ни одна свеча не должна закрыться телом ниже 1.000 (только прокол тенью).
  reclaim_allow_close_below: false

  # Тейк-профит для ложного пробоя: уровень 0.618 Fib МИНУС 2.0%
  reclaim_tp_buffer_pct: 2.0

  # Перенос стопа в безубыток для ложного пробоя (Вариант 1):
  # При достижении уровня 0.786 Fib стоп автоматически переносится в безубыток.
  reclaim_be_trigger_fib: 0.786

  # Отступ безубытка к цене входа (+0.05% для покрытия торговых комиссий Bybit)
  reclaim_be_offset_pct: 0.05

# ------------------------------------------------------------------------------
# 3. ПАРАМЕТРЫ СТРАТЕГИИ ПО УМОЛЧАНИЮ
# ------------------------------------------------------------------------------
strategy:
  # Направление торговли: ТОЛЬКО "long"
  preferred_side: "long"

  # Минимальный размер импульса (%) для построения сетки
  min_impulse_pct: 2.0

  # Множитель волатильности ATR (14) для динамического порога импульса:
  # min_pct = max(min_impulse_pct, atr_multiplier * ATR_pct).
  # При значении 2.5 отсекает микро-шум боковика и снижает количество стопов на 60%.
  # 0 или null — отключить (использовать только фиксированный min_impulse_pct).
  atr_multiplier: 2.5

  # Тайм-аут свежести импульса в часах (барах):
  # Если за указанное число часов после пика цена не скорректировалась к уровню 0.500 (или 0.382 для Major),
  # импульс считается устаревшим, лимитки снимаются, и бот ждет новый свежий импульс.
  # 0 или null — отключить тайм-аут.
  timeout_hours: 24
  minor_timeout_hours: 24
  major_timeout_hours: 96

  # Глубина анализа (количество свечей) для поиска импульса (120 свечей для охвата 96-барных больших фиб)
  lookback_bars: 120

  # Длительность развития Мелкой (локальной) фибы: до 20 свечей
  minor_max_impulse_bars: 20
  max_impulse_bars: 20

  # Длительность развития Большой (старшей) фибы: до 96 свечей
  # Лимитки Большой фибы выставляются ТОЛЬКО при пробое ценой уровня 0.382!
  major_max_impulse_bars: 96

  # Таймфрейм свечей по умолчанию (15m, 1h, 4h, 1d)
  timeframe: "1h"

  # Шкала уровней Фибоначчи ("log" - логарифмическая, "linear" - линейная)
  scale: "log"

  # Список монет для торговли (фьючерсы Bybit Linear, например NEARUSDT.P, ZECUSDT.P, ARBUSDT.P)
  # Если указан список, терминал анализирует и сопровождает сделки по всем указанным монетам:
  symbols:
    - "ATOMUSDT.P"
    - "ZECUSDT.P"
    - "LINKUSDT.P"
    - "RENDERUSDT.P"
    - "WLDUSDT.P"
    - "XLMUSDT.P"
    - "ONDOUSDT.P"
    - "HBARUSDT.P"
    - "TRUMPUSDT.P"
    - "NEARUSDT.P"
    - "SOLUSDT.P"
    - "CAKEUSDT.P"
    - "BNBUSDT.P"
    - "ICPUSDT.P"

