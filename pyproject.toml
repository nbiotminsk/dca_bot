[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dca_bot"
version = "0.1.0"
description = "Hedge DCA Volatility Analyzer & Trade Tracker"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.0",
  "pandas>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyarrow>=14.0",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]

[tool.setuptools]
packages = ["volatility_calc", "trade_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false